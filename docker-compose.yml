# Local development stack.
#   docker compose up --build              postgres -> migrate -> api + worker
#   docker compose --profile auth up       ... plus Keycloak (realm "dev")
# Ports and credentials come from .env (see .env.example); defaults below.

x-app: &app
  build:
    context: .
    args:
      APP_VERSION: ${APP_VERSION:-0.0.0}
      APP_COMMIT: ${APP_COMMIT:-local}
  image: ${APP_IMAGE:-backend-app}:local
  init: true
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8080/realms/dev}
    OIDC_AUDIENCE: ${OIDC_AUDIENCE:-api}
    # Inside the network Keycloak is "keycloak"; the issuer stays the browser-facing URL.
    OIDC_JWKS_URL: http://keycloak:8080/realms/dev/protocol/openid-connect/certs
    # pino-pretty is a dev dependency and not in the image.
    LOG_PRETTY: 'false'
    HTTP_HOST: 0.0.0.0
    METRICS_HOST: 0.0.0.0
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    entrypoint: ['bash', '/db/migrate.sh']
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    volumes:
      - ./db:/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *app
    command: ['api']
    environment:
      <<: *app-env
      HTTP_PORT: 3000
      METRICS_PORT: 9464
    ports:
      - '${HTTP_PORT:-3000}:3000'
      - '${METRICS_PORT:-9464}:9464'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health/ready']
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ['worker']
    environment:
      <<: *app-env
      WORKER_HTTP_PORT: 3001
      WORKER_METRICS_PORT: 9465
    ports:
      - '${WORKER_HTTP_PORT:-3001}:3001'
      - '${WORKER_METRICS_PORT:-9465}:9465'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health/ready']
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    profiles: ['auth']
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.0}
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens carry this issuer for every caller (browser, curl, containers).
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    volumes:
      - ./docker/keycloak/dev-realm.json:/opt/keycloak/data/import/dev-realm.json:ro
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'

volumes:
  pgdata:
